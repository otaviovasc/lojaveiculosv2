<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icons/lv-logo-black-red.svg" />
    <title>Loja Veiculos V2</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #lv-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        background: #f7ece7;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      #lv-splash .lv-splash-logo {
        width: 120px;
        height: auto;
      }
      #lv-splash .lv-splash-logo-dark {
        display: none;
      }
      #lv-splash .lv-splash-bar {
        width: 160px;
        height: 3px;
        border-radius: 999px;
        background: rgb(225 31 38 / 0.15);
        overflow: hidden;
      }
      #lv-splash .lv-splash-bar::before {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #e11f26;
        animation: lv-splash-slide 1.2s ease-in-out infinite;
      }
      @keyframes lv-splash-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(400%);
        }
      }
      #lv-splash .lv-splash-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
      @media (prefers-color-scheme: dark) {
        #lv-splash {
          background: #151515;
        }
        #lv-splash .lv-splash-logo-light {
          display: none;
        }
        #lv-splash .lv-splash-logo-dark {
          display: block;
        }
        #lv-splash .lv-splash-bar {
          background: rgb(225 31 38 / 0.22);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #lv-splash .lv-splash-bar::before {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="lv-splash" role="status">
        <img
          class="lv-splash-logo lv-splash-logo-light"
          src="/icons/lv-logo-black-red.svg"
          alt="Loja Veículos"
          width="120"
        />
        <img
          class="lv-splash-logo lv-splash-logo-dark"
          src="/icons/lv-logo-white-red.svg"
          alt=""
          aria-hidden="true"
          width="120"
        />
        <div class="lv-splash-bar"></div>
        <span class="lv-splash-sr">Carregando…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
